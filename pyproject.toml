[project]
name = "open-arena"
version = "0.1.0"
description = "Open Arena evaluation framework for general datasets using Langfuse, LiteLLM, and multi-metric analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "fastmcp",
    "fastapi-mcp",
    "langchain",
    "langchain-core",
    "langchain-mcp-adapters",
    "langchain-openai",
    "langfuse>=3.10.1",
    "langgraph>=0.6.6",
    "litellm>=1.79.3",
    "matplotlib",
    "networkx",
    "openai",
    "openpyxl",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
    "pandas>=2.3.3",
    "playwright",
    "pydantic",
    "python-dotenv",
    "pyyaml",
    "streamlit",
    "uvicorn",
    "xlsxwriter>=3.2.9",
]
