[project]
name = "open-arena"
version = "0.1.0"
description = "Autoresearch loop for reward R&D and model selection — between post-training evals and the next round of fine-tuning / RL."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Athena-Reply" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Environment :: Console",
    "Operating System :: OS Independent",
]
dependencies = [
    "arize-phoenix-client>=2.6.0",
    "braintrust>=0.18.0",
    "click>=8.1.8",
    "datasets>=4.8.5",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    # Direct imports in src/datasets/dataset.py + src/evaluate.py —
    # declared explicitly so installs don't rely on these being pulled in
    # transitively (today they ship via synalinks / datasets / langchain,
    # but a future minor version bump elsewhere could drop them).
    "jinja2>=3.1",
    "keras-tuner>=1.4.8",
    "langfuse>=4.5.1",
    "langsmith>=0.7.38",
    "numpy>=2.0",
    "opik>=2.0.20",
    "pyarrow>=23.0.1",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "synalinks>=0.9.2",
    "uvicorn>=0.30.0",
    # workspace packages -- installed together with the engine
    "open-arena-core",
    "open-arena-cli",
]

[project.optional-dependencies]
# `deep_eval` reward — wraps `deepeval.metrics` so any DeepEval metric
# (G-Eval, AnswerRelevancy, Hallucination, …) can be selected from YAML.
# Install with `uv sync --extra deepeval`.
deepeval = ["deepeval>=2.0.0"]

# `unity_catalog` dataset provider — reads Delta/Parquet tables from
# Databricks or OSS Unity Catalog via the REST API + S3-compatible object
# storage.  Install with `uv sync --extra unity_catalog`.
# httpx is already in the core deps (pulled transitively); listed here for
# explicitness so the extra is self-documenting.
unity_catalog = [
    "unitycatalog-client>=0.3.0",
    "deltalake>=0.18",
    "boto3>=1.34",
    "pyarrow>=23.0.1",
    "httpx>=0.27",
]

# `postgres` Store adapter (WS1) — managed Postgres persistence behind the
# Store port, with Alembic migrations. Select with OPEN_ARENA_STORE=postgres
# and DATABASE_URL=postgresql+psycopg://...  Install with `uv sync --extra postgres`.
postgres = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
]

# `mlflow` ResultsSink adapter (WS5) — logs run metrics/artifacts to MLflow.
# Select with OPEN_ARENA_RESULTS_SINK=mlflow and MLFLOW_TRACKING_URI=...
# Install with `uv sync --extra mlflow`.
mlflow = [
    "mlflow-skinny>=2.14",
]

# `e2b` SandboxProvider adapter (WS6) — runs verifiers in E2B-compatible
# sandboxes (CubeSandbox lands in ModelFactory soon). Select with
# OPEN_ARENA_SANDBOX=e2b and E2B_API_KEY=...  Install with `uv sync --extra e2b`.
e2b = [
    "e2b>=1.0",
]

# `keycloak` AuthProvider adapter (WS7) — validates Keycloak/OIDC JWTs and
# derives the org claim. Select with OPEN_ARENA_AUTH=keycloak and OIDC_ISSUER=...
# Install with `uv sync --extra keycloak`.
keycloak = [
    "pyjwt[crypto]>=2.8",
    "httpx>=0.27",
]

# The `arena` console script now lives in `open-arena-cli`.
# Installing `open-arena` brings the full stack (engine + CLI).

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------------------------------------------------------------------------
# uv workspace -- root is open-arena (engine); sub-packages provide the
# lightweight core models and standalone CLI.
# ---------------------------------------------------------------------------
[tool.uv.workspace]
members = ["packages/open-arena-core", "packages/open-arena-cli"]

[tool.uv.sources]
open-arena-core = { workspace = true }
open-arena-cli = { workspace = true }
[tool.pytest.ini_options]
testpaths = [
    "tests",
    "packages/open-arena-cli/tests",
    "packages/open-arena-core/tests",
]
