[project]
name = "openarena"
version = "0.2.0"
description = "Compare language models and agents on datasets, score them, and rank them on leaderboards."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "synalinks>=0.10.18",
    "keras-tuner>=1.4.8",
    "a2a-sdk>=1.2.1",
    "datasets>=5.0",
    "pydantic>=2.13",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "numpy>=2.5",
    "click>=8.5.0",
    "rich>=15.0.0",
    "harbor[e2b]>=0.23",
]

# The SDKs of the dataset providers that read a platform, one extra per provider
# (`openarena[langfuse]`); `all` has every one. Each is imported only when its
# provider reads a dataset, which says which extra to install when it is missing.
[project.optional-dependencies]
langfuse = ["langfuse>=3.10.1"]
langsmith = ["langsmith"]
opik = ["opik"]
phoenix = ["arize-phoenix-client"]
braintrust = ["braintrust"]
unity-catalog = ["deltalake"]
all = ["openarena[langfuse,langsmith,opik,phoenix,braintrust,unity-catalog]"]

[project.urls]
Homepage = "https://github.com/Atena-IT/open-arena"
Documentation = "https://atena-it.github.io/open-arena/"
Repository = "https://github.com/Atena-IT/open-arena"

[project.scripts]
openarena = "openarena.cli.main:cli"

[dependency-groups]
dev = ["pytest>=8"]
docs = [
    "mkdocstrings[python]>=1.0",
    "zensical>=0.0.70",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

