[project]
name = "open-arena-core"
version = "0.1.0"
description = "Pydantic models, API client, and constants for Open Arena — installable without the heavy evaluation engine."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Athena-Reply" }]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["open_arena_core"]
