[project]
name = "open-arena-cli"
version = "0.1.0"
description = "Standalone CLI for Open Arena — thin remote ops without the evaluation engine."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Athena-Reply" }]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "open-arena-core",
]

[project.optional-dependencies]
# Install the full engine to enable local sweep, serve, and --local mode.
server = ["open-arena"]

[project.scripts]
arena = "open_arena_cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["open_arena_cli"]

[tool.uv.sources]
open-arena-core = { workspace = true }
open-arena = { workspace = true }
