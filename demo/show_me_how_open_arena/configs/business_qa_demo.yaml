dataset:
  name: "Vanguard Research Missions Demo"
  description: "Mission-based dataset for constrained deep-research agent evaluation"
  source:
    provider: "local"
    path: "demo/show_me_how_open_arena/data/business_qa_demo.csv"
    format: "csv"
  input: |
    Mission title: {{ mission_title }}
    Research domain: {{ research_domain }}
    Topic cluster: {{ topic_cluster }}
    Time window: {{ timeframe_start }} to {{ timeframe_end }}
    Allowed domains: {{ allowed_domains }}
    Focus semantics: {{ focus_semantics }}
    Output type: {{ output_type }}
    Audience: {{ audience }}
    Difficulty: {{ difficulty }}
    SME owner: {{ sme_owner }}

    Mission:
    {{ question }}
  expected_output: "{{ expected_answer }}"
  limit: 12

system_prompt: |
  You are a constrained deep-research assistant.
  Transform each mission into a structured, decision-useful report.
  Stay inside the requested domain, respect the allowed domains and time window,
  prioritize mission-native retrieval, avoid generic AI commentary, and cite sources clearly.

experiments:
  - name: "gpt-5.4-mini"
    litellm:
      model: "gpt-5.4-mini"
      temperature: 0.2
      max_tokens: 384
  - name: "gpt-5.4-nano"
    litellm:
      model: "gpt-5.4-nano"
      temperature: 0.2
      max_tokens: 384

evaluation:
  method: "llm_as_judge"
  litellm:
    model: "gpt-5.4-nano"
    temperature: 0.0
    max_tokens: 1024
  score_name: "mission_report_quality_score"
  max_concurrency: 5
  system_prompt: >
    You are an expert evaluator for constrained deep-research reports.
    Given a JSON object with the fields "input", "output", and "expected_output",
    score how well the output respects topic scope, date constraints, source discipline,
    structured synthesis, and practical decision usefulness.
    Return ONLY a JSON object with this format:
    {"thinking": "Short reasoning.", "score": 4}
    The score must be an integer from 1 to 5.
  system_prompt_no_reference: >
    You are an expert evaluator for constrained deep-research reports.
    Given a JSON object with the fields "input" and "output",
    score the output for topic discipline, source-awareness, structural clarity,
    and practical decision usefulness.
    Return ONLY a JSON object with this format:
    {"thinking": "Short reasoning.", "score": 4}
    The score must be an integer from 1 to 5.
