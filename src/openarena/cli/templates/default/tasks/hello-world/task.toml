# A Harbor task (https://harborframework.com/docs/tasks): this folder is one row of a
# `harbor_tasks` dataset (configs/datasets.yaml, `hello-tasks`). Harbor builds environment/,
# gives the agent instruction.md, then runs tests/test.sh, whose score the `harbor_verifier`
# reward reads. solution/solve.sh is what a correct agent does: Harbor's `oracle` agent runs
# it, and the tests must then pass.

[metadata]
difficulty = "easy"
category = "general"

[agent]
# How long the agent may work on the task, in seconds.
timeout_sec = 300.0

[verifier]
# How long tests/test.sh may take.
timeout_sec = 60.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
# network_mode = "no-network"        # cut the agent off the network ("public" by default)
# docker_image = "python:3.12-slim"  # a prebuilt image instead of environment/Dockerfile
