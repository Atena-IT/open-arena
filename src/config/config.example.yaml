# Example configuration file for multi-language model evaluation framework

dataset:
  name: "QA Dataset"
  source: "QA.xlsx"
  format: "excel"
  type: "QA"

tracking: "langfuse"

system_prompt: >
  You are an assistant.

experiments:
  - name: "exp_gpt5-mini"
    litellm:
      model: "gpt-5-mini"
      max_tokens: 500

  - name: "exp_gpt4.1-nano"
    litellm:
      model: "gpt-4.1-nano"
      max_tokens: 500