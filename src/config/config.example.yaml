# Example configuration file for multi-language model evaluation framework

dataset:
  name: "QA Dataset"
  source: "QA.xlsx"
  format: "excel"
  type: "QA"

tracking: "langfuse"

system_prompt: >
  You are an assistant.

experiments:
  - name: "exp_gpt5-mini"
    litellm:
      model: "gpt-5-mini"
      max_tokens: 500

  - name: "exp_gpt4.1-nano"
    litellm:
      model: "gpt-4.1-nano"
      temperature: 0.7
      max_tokens: 500

evaluation:
  method: "llm_as_judge"
  litellm:
    model: "gpt-4.1-nano"
    temperature: 0
    max_tokens: 300
