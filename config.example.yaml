# Example configuration for open-arena.
# Copy to config.yaml, then edit / remove the entries you don't need.

# --- Synalinks defaults (optional) -----------------------------------------
# Process-wide fallbacks applied via `synalinks.set_default_language_model()`
# / `synalinks.set_default_embedding_model()` at sweep boot. Reward specs
# that omit `language_model:` / `embedding_model:` pick these up — handy
# when many rewards share the same judge / embedder. Synalinks persists
# the identifier to `~/.synalinks/synalinks.json` as a side effect (its
# documented behavior for string identifiers).
# default_language_model: ollama/llama3.2
# default_embedding_model: ollama/mxbai-embed-large

# Reproducibility seed for `numpy.random` and `random` (applied via
# `synalinks.set_seed`). Does not seed LM provider sampling — that's
# governed by the provider's own RNG and `temperature:`.
# seed: 42

# --- Datasets ---------------------------------------------------------------
# Each entry under `datasets:` is a named source. The `type:` field selects a
# provider (see src/datasets/__init__.py:_DATASET_TYPES); every other key is
# forwarded to that provider's constructor as a kwarg, except for the
# special keys below which are consumed by evaluate.py.
#
# Templates render to JSON. `input_template` builds the program's input
# (defaults to synalinks.ChatMessages); `output_template` builds the target
# (defaults to synalinks.ChatMessage — the Generator's default output type).
# Omitting `output_template` makes the dataset inputs-only; rewards then see
# `y_true=None` and must handle that case (lm_as_judge does, exact_match
# doesn't).
#
# `generator:` and `agent:` are mutually exclusive — pick the program graph
# the trial runs:
#
# - `generator:` (per-dataset, optional) is forwarded as kwargs to
#   `synalinks.Generator(...)` — one LM call per row. Common knobs:
#   temperature, reasoning_effort, instructions, prompt_template, examples,
#   use_inputs_schema, use_outputs_schema.
#
# - `agent:` (per-dataset, optional) turns the trial into a
#   `synalinks.FunctionCallingAgent` driven by MCP tools — multi-step
#   tool/observe/decide loop per row. Servers are declared once under the
#   top-level `mcp_servers:` registry and referenced by name from each
#   agentic dataset's `agent.mcp_servers:` list. See the `agentic_math_eval`
#   example below.
#
# `reward:` (per-dataset, required) is the scoring function for this dataset.
# Either a string (snake_case name of a synalinks.rewards.Reward subclass) or
# a dict with `name:` plus constructor kwargs. `language_model:` and
# `embedding_model:` strings are auto-resolved into synalinks instances.
# Add `direction: min | max` (keras-tuner convention, default `max`) under
# the dict form when the dataset's primary metric is loss-style — the
# per-dataset tuner uses it to rank trials in the right direction.
# Per-dataset, so different datasets in the same sweep can mix loss-style
# and reward-style primaries freely.
#
# `repeat:` (per-dataset, optional, default 1) emits each raw example N times
# in a row before moving on. Setting `repeat == batch_size` makes every batch
# a group of N rollouts of the same prompt — the GRPO-style RL layout where
# reward statistics are computed across rollouts of one input.
#
# `metrics:` (per-dataset, optional) is a list of metric / reward identifiers
# forwarded to `program.compile(metrics=...)`. They ride along the primary
# evaluate() pass (no extra LM calls) and surface as additional columns in
# the result TSV. Identifiers resolve in two registries: project rewards
# (auto-wrapped in `synalinks.metrics.MeanMetricWrapper`) and synalinks
# built-in metrics. Entry shapes:
#   - String: snake_case identifier (the class name lowercased + underscored),
#     e.g. `- total_tokens`. Same convention as reward identifiers.
#   - Dict: `class:` (required) is the identifier. `alias:` overrides the
#     column header (defaults to the metric's `.name`). `direction:` is the
#     keras-tuner ranking direction (`max` | `min`, default `max`) — use
#     `min` for cost / token-style metrics. `objective: true` promotes the
#     entry to a tuner objective for that dataset (paired with the primary
#     `reward` on the Pareto frontier). All other keys flow as constructor
#     kwargs, including `name:` which controls the metric's internal
#     `.name` (the key synalinks writes into its result dict).
# A sweep-wide list under the top-level `metrics:` block (see the bottom of
# this file) is applied to every dataset; per-dataset entries with the same
# alias take precedence.

# --- MCP server registry ----------------------------------------------------
# Top-level map of {server_name: connection_dict}. Each connection follows
# one of the synalinks `Connection` TypedDicts — `stdio`,
# `streamable_http`, `sse`, or `websocket` — discriminated by `transport:`.
# Servers declared here are not started automatically; they must already
# be reachable when an agentic trial runs. Datasets opt in via
# `agent.mcp_servers: [name1, name2]`.
#
# Commented out: this section is dormant unless at least one dataset
# references it. Uncomment alongside the matching dataset block below.
# mcp_servers:
#   math:
#     transport: stdio
#     command: python
#     args: ["/abs/path/to/math_server.py"]
#   weather:
#     transport: streamable_http
#     url: http://localhost:8000/mcp

datasets:

  # MMLU multiple-choice via HuggingFace, streamed, capped at 50 items.
  mmlu_test:
    type: huggingface
    path: cais/mmlu
    name: all                 # HF config name (not the dataset selector)
    split: test
    streaming: true
    limit: 50
    batch_size: 1
    input_template: |
      {
        "messages": [
          {
            "role": "user",
            "content": {{ ("Question: " ~ question ~ "\nA) " ~ choices[0] ~ "\nB) " ~ choices[1] ~ "\nC) " ~ choices[2] ~ "\nD) " ~ choices[3] ~ "\n\nAnswer with a single letter A, B, C, or D.") | tojson }}
          }
        ]
      }
    output_template: |
      {
        "role": "assistant",
        "content": {{ ["A", "B", "C", "D"][answer] | tojson }}
      }
    generator:
      temperature: 0.0
      instructions: |
        You are answering a multiple-choice question. Reply with exactly one letter:
        A, B, C, or D. Do not include any explanation, punctuation, or extra text.
    reward:
      name: exact_match
      in_mask: [content]
      # `direction:` (default `max`) is the keras-tuner convention for
      # ranking. Add `direction: min` to a dataset whose primary metric is
      # loss-style (cross-entropy, edit distance, harm rate, ...). The
      # per-dataset tuner honors it for trial ranking, so a single sweep
      # can mix max-direction and min-direction primaries.
      # direction: max
    # Optional per-dataset synalinks metrics (free — share the primary
    # evaluate() pass). Combined with the top-level `metrics:` block; same
    # alias on both → this side wins.
    # metrics:
    #   - tokens_per_second                # string: snake_case identifier
    #   - class: avg_cost_per_call         # lower is cheaper
    #     direction: min

  # GSM8K math word problems via HuggingFace (illustrates a different schema
  # AND a task-specific generator prompt).
  gsm8k_train:
    type: huggingface
    path: gsm8k
    name: main
    split: train
    streaming: true
    limit: 100
    batch_size: 4
    input_template: |
      {
        "messages": [
          {"role": "user", "content": {{ question | tojson }}}
        ]
      }
    output_template: |
      {
        "role": "assistant",
        "content": {{ answer.split("####")[-1].strip() | tojson }}
      }
    generator:
      temperature: 0.0
      instructions: |
        Solve the math word problem. Reply with only the final numerical answer —
        no units, no explanation, no extra text.
    reward:
      name: exact_match
      in_mask: [content]

  # HellaSwag — commonsense continuation, 4-way MCQ.
  hellaswag_validation:
    type: huggingface
    path: Rowan/hellaswag
    split: validation               # `test` labels are hidden
    streaming: true
    limit: 50
    batch_size: 1
    input_template: |
      {
        "messages": [
          {
            "role": "user",
            "content": {{ (ctx ~ "\nA) " ~ endings[0] ~ "\nB) " ~ endings[1] ~ "\nC) " ~ endings[2] ~ "\nD) " ~ endings[3]) | tojson }}
          }
        ]
      }
    output_template: |
      {"role": "assistant", "content": {{ ["A", "B", "C", "D"][label | int] | tojson }}}
    generator:
      temperature: 0.0
      instructions: |
        Pick the most plausible continuation. Reply with exactly one letter:
        A, B, C, or D. No explanation, no extra text.
    reward:
      name: exact_match
      in_mask: [content]

  # ARC-Challenge — grade-school science MCQ. Choice count varies (3–5),
  # so the input template loops over `choices.text` / `choices.label`.
  arc_challenge_test:
    type: huggingface
    path: allenai/ai2_arc
    name: ARC-Challenge
    split: test
    streaming: true
    limit: 50
    batch_size: 1
    input_template: |
      {%- set lines = [] -%}
      {%- for i in range(choices.text | length) -%}
        {%- set _ = lines.append(choices.label[i] ~ ") " ~ choices.text[i]) -%}
      {%- endfor -%}
      {
        "messages": [
          {"role": "user", "content": {{ (question ~ "\n" ~ lines | join("\n")) | tojson }}}
        ]
      }
    output_template: |
      {"role": "assistant", "content": {{ answerKey | tojson }}}
    generator:
      temperature: 0.0
      instructions: |
        Answer the science question. Reply with only the letter (or number) of the
        correct choice — no explanation, no extra text.
    reward:
      name: exact_match
      in_mask: [content]

  # WinoGrande — pronoun resolution, binary choice. Answer is "1" or "2".
  winogrande_validation:
    type: huggingface
    path: allenai/winogrande
    name: winogrande_xl             # other configs: winogrande_{xs,s,m,l}, winogrande_debiased
    split: validation
    streaming: true
    limit: 50
    batch_size: 1
    input_template: |
      {
        "messages": [
          {"role": "user", "content": {{ (sentence ~ "\n1) " ~ option1 ~ "\n2) " ~ option2) | tojson }}}
        ]
      }
    output_template: |
      {"role": "assistant", "content": {{ answer | tojson }}}
    generator:
      temperature: 0.0
      instructions: |
        Choose which option fills the blank (marked `_`) in the sentence. Reply
        with only "1" or "2" — no explanation, no extra text.
    reward:
      name: exact_match
      in_mask: [content]

  # BoolQ — yes/no reading comprehension.
  boolq_validation:
    type: huggingface
    path: google/boolq
    split: validation
    streaming: true
    limit: 50
    batch_size: 1
    input_template: |
      {
        "messages": [
          {"role": "user", "content": {{ (passage ~ "\n\nQuestion: " ~ question ~ "?") | tojson }}}
        ]
      }
    output_template: |
      {"role": "assistant", "content": {{ ("yes" if answer else "no") | tojson }}}
    generator:
      temperature: 0.0
      instructions: |
        Read the passage and answer the question. Reply with exactly one word:
        "yes" or "no" — no explanation, no extra text.
    reward:
      name: exact_match
      in_mask: [content]

  # BIG-Bench Hard — 23 challenging tasks. `lukaemon/bbh` exposes one config
  # per task; here we sample `boolean_expressions`. Swap `name:` for any of
  # the other 22 (e.g. `date_understanding`, `causal_judgement`, ...).
  bbh_boolean_expressions:
    type: huggingface
    path: lukaemon/bbh
    name: boolean_expressions
    split: test
    streaming: true
    limit: 50
    batch_size: 1
    input_template: |
      {"messages":[{"role":"user","content": {{ input | tojson }}}]}
    output_template: |
      {"role":"assistant","content": {{ target | tojson }}}
    generator:
      temperature: 0.0
      instructions: |
        Evaluate the boolean expression. Reply with exactly one word — `True` or
        `False`, with that capitalization — and nothing else.
    reward:
      name: exact_match
      in_mask: [content]

  # DROP — discrete reasoning over paragraphs. Answer is a span/number/date.
  drop_validation:
    type: huggingface
    path: ucinlp/drop
    split: validation
    streaming: true
    limit: 50
    batch_size: 1
    input_template: |
      {"messages":[{"role":"user","content": {{ (passage ~ "\n\nQuestion: " ~ question) | tojson }}}]}
    output_template: |
      {"role":"assistant","content": {{ answers_spans.spans[0] | tojson }}}
    generator:
      temperature: 0.0
      instructions: |
        Answer the question using a short span from the passage (a number, date, or short
        phrase). Reply with only the answer — no explanation, no extra text.
    # NOTE: Official DROP scoring is F1 over normalized spans; `exact_match` is a
    # stricter approximation. Swap for a custom reward to reproduce the headline metric.
    reward:
      name: exact_match
      in_mask: [content]

  # TruthfulQA (MC1) — pick the single truthful answer. Choice count varies (4–13).
  truthfulqa_mc1:
    type: huggingface
    path: truthful_qa
    name: multiple_choice
    split: validation
    streaming: true
    limit: 50
    batch_size: 1
    input_template: |
      {%- set letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ" -%}
      {%- set lines = [] -%}
      {%- for i in range(mc1_targets.choices | length) -%}
        {%- set _ = lines.append(letters[i] ~ ") " ~ mc1_targets.choices[i]) -%}
      {%- endfor -%}
      {"messages":[{"role":"user","content": {{ (question ~ "\n" ~ lines | join("\n")) | tojson }}}]}
    output_template: |
      {%- set letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ" -%}
      {"role":"assistant","content": {{ letters[mc1_targets.labels.index(1)] | tojson }}}
    generator:
      temperature: 0.0
      instructions: |
        Pick the single truthful answer. Reply with exactly one letter — no explanation.
    reward:
      name: exact_match
      in_mask: [content]

  # HumanEval — code generation. Real scoring runs the candidate against unit
  # tests; `exact_match` here is just a placeholder to wire the dataset up.
  humaneval:
    type: huggingface
    path: openai/openai_humaneval
    split: test
    streaming: true
    limit: 50
    batch_size: 1
    input_template: |
      {"messages":[{"role":"user","content": {{ prompt | tojson }}}]}
    output_template: |
      {"role":"assistant","content": {{ canonical_solution | tojson }}}
    generator:
      temperature: 0.0
      instructions: |
        Complete the Python function. Output only the indented function body
        (the code that goes inside the function). Do not repeat the signature or
        docstring, do not wrap the output in markdown code fences, do not add
        any explanation.
    # NOTE: Use a code-execution reward for the real pass@k metric.
    reward:
      name: exact_match
      in_mask: [content]

  # IFEval — instruction following. Scored by rule-based verifiers in the
  # original benchmark; we use lm_as_judge here as a rough approximation.
  ifeval:
    type: huggingface
    path: google/IFEval
    split: train
    streaming: true
    limit: 50
    batch_size: 1
    input_template: |
      {"messages":[{"role":"user","content": {{ prompt | tojson }}}]}
    output_template: |
      {"role":"assistant","content": {{ prompt | tojson }}}
    generator:
      temperature: 0.0
      instructions: |
        Follow the instruction exactly as stated.
    reward:
      name: lm_as_judge
      language_model: ollama/llama3.2
      in_mask: [content]
      instructions: |
        Score 0.0–1.0 on how strictly the response satisfies every constraint
        in the original instruction. The "expected" field contains the original
        instruction for reference.

  # SQuAD v1.1 — extractive reading comprehension.
  squad_validation:
    type: huggingface
    path: rajpurkar/squad
    split: validation
    streaming: true
    limit: 50
    batch_size: 1
    input_template: |
      {"messages":[{"role":"user","content": {{ (context ~ "\n\nQuestion: " ~ question) | tojson }}}]}
    output_template: |
      {"role":"assistant","content": {{ answers.text[0] | tojson }}}
    generator:
      temperature: 0.0
      instructions: |
        Answer using a short span from the context. Reply with only the answer span.
    reward:
      name: exact_match
      in_mask: [content]

  # LogiQA — logical reasoning, 4-way MCQ. Using fireworks-ai's Parquet
  # mirror; `options` strings already include "A." / "B." / ... prefixes.
  logiqa_test:
    type: huggingface
    path: fireworks-ai/logiqa
    split: test
    streaming: true
    limit: 50
    batch_size: 1
    input_template: |
      {
        "messages": [
          {
            "role": "user",
            "content": {{ (context ~ "\n\nQuestion: " ~ question ~ "\n" ~ options | join("\n")) | tojson }}
          }
        ]
      }
    output_template: |
      {"role":"assistant","content": {{ answer | tojson }}}
    generator:
      temperature: 0.0
      instructions: |
        Read the context and answer with exactly one letter: A, B, C, or D.
    reward:
      name: exact_match
      in_mask: [content]

  # BBQ — Bias Benchmark for QA. walledai/BBQ is a clean Parquet mirror with
  # one split per category (lowercase: age, gender_identity, race_ethnicity,
  # religion, ses, ...). Each example is a 3-way MCQ.
  bbq_age:
    type: huggingface
    path: walledai/BBQ
    split: age
    streaming: true
    limit: 50
    batch_size: 1
    input_template: |
      {
        "messages": [
          {
            "role": "user",
            "content": {{ (context ~ "\n" ~ question ~ "\nA) " ~ choices[0] ~ "\nB) " ~ choices[1] ~ "\nC) " ~ choices[2]) | tojson }}
          }
        ]
      }
    output_template: |
      {"role":"assistant","content": {{ ["A", "B", "C"][answer] | tojson }}}
    generator:
      temperature: 0.0
      instructions: |
        Answer with exactly one letter: A, B, or C. No explanation.
    reward:
      name: exact_match
      in_mask: [content]

  # LAMBADA — predict the last word of a passage. We strip the final word from
  # `text` to form the prompt, and use it as the target.
  lambada_test:
    type: huggingface
    path: EleutherAI/lambada_openai
    name: en
    split: test
    streaming: true
    limit: 50
    batch_size: 1
    input_template: |
      {%- set words = text.split() -%}
      {"messages":[{"role":"user","content": {{ ((words[:-1] | join(" ")) ~ " ___") | tojson }}}]}
    output_template: |
      {"role":"assistant","content": {{ text.split()[-1] | tojson }}}
    generator:
      temperature: 0.0
      instructions: |
        Predict the missing final word that fills the blank (marked `___`).
        Reply with exactly one word — no punctuation, no explanation.
    reward:
      name: exact_match
      in_mask: [content]

  # Folder dataset — one record per file. Use this for hand-curated test cases
  # checked into the repo, or for ad-hoc evaluations where each example lives
  # in its own JSON / YAML / text / markdown file. Format is auto-detected per
  # file from the extension; dict-shaped records (`.json` / `.yaml` / `.yml`)
  # spread their keys at the top level. Plain text (`.txt` / `.md`) is exposed
  # as `text`. All records additionally expose `_filename`, `_stem`, `_path`.
  folder_eval:
    type: folder
    path: data/cases
    pattern: "*.json"             # glob; combine with `recursive: true` for nested folders
    # format: json                # override per-file auto-detection (json | yaml | text)
    batch_size: 1
    limit: 20
    input_template: |
      {"messages":[{"role":"user","content": {{ question | tojson }}}]}
    output_template: |
      {"role":"assistant","content": {{ answer | tojson }}}
    generator:
      temperature: 0.0
      instructions: |
        Answer the question concisely.
    reward:
      name: exact_match
      in_mask: [content]

  # Agentic dataset — uses a `synalinks.FunctionCallingAgent` driven by MCP
  # tools instead of a single Generator call. The agent runs its own
  # call-tool / observe / decide loop per row (capped by `max_iterations`)
  # and returns either a free-form chat answer (no output_template) or a
  # structured final answer (output_template + matching schema/data_model).
  #
  # `agent:` and `generator:` are mutually exclusive on a dataset.
  # Commented out by default — to enable: (1) uncomment this block,
  # (2) uncomment the matching `mcp_servers:` block at the top of the
  # file, and (3) add `agentic_math_eval` to `experiments.datasets:`.
  # agentic_math_eval:
  #   type: folder
  #   path: data/agent_cases
  #   pattern: "*.json"
  #   batch_size: 1
  #   input_template: |
  #     {"messages":[{"role":"user","content": {{ question | tojson }}}]}
  #   # No output_template → inputs-only, agent returns a free-form chat answer.
  #   # Add an output_template + output_schema if you want structured answers.
  #   agent:
  #     type: function_calling          # only supported value
  #     mcp_servers: [math]             # references top-level `mcp_servers:` registry
  #     max_iterations: 5
  #     autonomous: true
  #     use_chain_of_thought: true
  #     temperature: 0.0
  #     instructions: |
  #       Solve the user's problem by calling the available tools. Reason
  #       step by step, call tools when you need them, and stop when you
  #       have enough information to answer.
  #     # Any other FunctionCallingAgent kwarg (final_instructions,
  #     # use_inputs_schema, examples, prompt_template, ...) can also be
  #     # set here. `language_model`, `tools`, `data_model`, `schema` are
  #     # set automatically and rejected if also present.
  #   reward:
  #     # Idiomatic for the inputs-only autonomous agent above: lm_as_judge
  #     # scores the final assistant content on its own merits (y_true=None).
  #     name: lm_as_judge
  #     language_model: ollama/llama3.2
  #     instructions: |
  #       Score 0.0–1.0 on whether the agent solved the user's problem,
  #       used the available tools sensibly, and stopped when it had
  #       enough information.
  #     in_mask: [content]
  #     # For DeepEval `ToolCorrectnessMetric` you need top-level `tool_calls`
  #     # on y_pred (the default mask is `recursive=False`). That requires an
  #     # `output_template` + `output_schema` on the dataset that surfaces
  #     # tool_calls at the root, plus a y_true with the gold tool calls.
  #     # Without that wiring the default mask returns no fields and the
  #     # reward fails-fast at runtime.

  # Langfuse-managed evaluation set, pinned to a UTC snapshot.
  # Auth comes from LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY / LANGFUSE_HOST.
  langfuse_eval:
    type: langfuse
    dataset_name: my_eval_set
    version: "2026-04-15T00:00:00Z"   # omit for latest
    batch_size: 1
    limit: 20
    input_template: |
      {"messages":[{"role":"user","content": {{ input | tojson }}}]}
    output_template: |
      {"role":"assistant","content": {{ expected_output | tojson }}}
    # LM-as-judge: a different reward shape per dataset is fine and expected.
    reward:
      name: lm_as_judge
      language_model: ollama/llama3.2
      instructions: |
        Score the assistant's answer 0.0–1.0 based on factual correctness.
      in_mask: [content]            # only compare these fields, ignore others
      # out_mask: [thinking]        # ...or strip these fields before comparing
    # Alternative — cosine similarity against an embedding model:
    # reward:
    #   name: cosine_similarity
    #   embedding_model: ollama/mxbai-embed-large

  # LangSmith dataset. `inputs` / `outputs` are dicts on each Example, so
  # templates dot-access fields. Auth comes from LANGSMITH_API_KEY (and
  # optionally LANGSMITH_ENDPOINT for self-hosted).
  langsmith_eval:
    type: langsmith
    dataset_name: my_eval_set
    as_of: "prod"                   # version tag — or a UTC datetime, or omit for latest
    batch_size: 1
    limit: 20
    input_template: |
      {"messages":[{"role":"user","content": {{ inputs.question | tojson }}}]}
    output_template: |
      {"role":"assistant","content": {{ outputs.answer | tojson }}}
    reward:
      name: exact_match
      in_mask: [content]

  # Opik (Comet) dataset. Standard fields are `input` / `expected_output` /
  # `metadata` / `id`; any custom fields you inserted are passed through as
  # extra Jinja variables. Auth: OPIK_API_KEY + OPIK_WORKSPACE (cloud) or
  # OPIK_URL_OVERRIDE (self-hosted).
  opik_eval:
    type: opik
    dataset_name: my_eval_set
    version: v1                     # Opik named version — omit for latest
    # filter_string: 'tags contains "regression"'
    batch_size: 1
    limit: 20
    input_template: |
      {"messages":[{"role":"user","content": {{ input.question | tojson }}}]}
    output_template: |
      {"role":"assistant","content": {{ expected_output.answer | tojson }}}
    reward:
      name: exact_match
      in_mask: [content]

  # Arize Phoenix dataset. Each example exposes `input` / `output` /
  # `metadata` / `id` (all dicts). Auth: PHOENIX_API_KEY (cloud) and/or
  # PHOENIX_COLLECTOR_ENDPOINT (self-hosted; defaults to localhost:6006).
  phoenix_eval:
    type: phoenix
    dataset_name: my_eval_set
    # version_id: "abc123..."       # pin to a specific version (omit for latest)
    # splits: [test]                # restrict to named splits
    batch_size: 1
    limit: 20
    input_template: |
      {"messages":[{"role":"user","content": {{ input.question | tojson }}}]}
    output_template: |
      {"role":"assistant","content": {{ output.answer | tojson }}}
    reward:
      name: exact_match
      in_mask: [content]

  # Braintrust dataset. Records expose `id` / `input` / `expected` /
  # `metadata` (input/expected are arbitrary JSON, dot-access if dict).
  # Auth: BRAINTRUST_API_KEY (+ optional BRAINTRUST_ORG_NAME).
  braintrust_eval:
    type: braintrust
    project: my-project
    dataset_name: my_eval_set
    # version: "1000000000000"      # transaction id snapshot — omit for latest
    batch_size: 1
    limit: 20
    input_template: |
      {"messages":[{"role":"user","content": {{ input.question | tojson }}}]}
    output_template: |
      {"role":"assistant","content": {{ expected.answer | tojson }}}
    reward:
      name: exact_match
      in_mask: [content]

# Which dataset to use when no name is passed to load_dataset_from_yaml().
default: mmlu_test

# --- Top-level metrics ------------------------------------------------------
# Sweep-wide always-on observability + any extra scoring functions. Each
# entry is a `synalinks.metrics.Metric` attached to every (model, dataset)
# trial via `program.compile(metrics=...)`. Metrics ride along the primary
# `evaluate()` pass — no extra LM calls.
#
# Identifiers resolve in two registries:
#   - Synalinks metrics (`total_tokens`, `categorical_f1_score`, ...) —
#     resolved via `synalinks.metrics.get(...)`.
#   - Project rewards (`exact_match`, `lm_as_judge`, `cosine_similarity`,
#     `multi_judge_panel`, `recursive_lm_as_judge`, `deep_eval`) — auto-
#     wrapped in `MeanMetricWrapper` so they function as metrics. This is
#     how you add an LM judge or any extra scoring function: it rides the
#     same evaluate() pass as the primary reward — no extra K× cost.
#
# Per entry:
#   - `class:` (required) — the identifier.
#   - `alias:` (optional) — column name + metric `.name`. Defaults to the
#     metric's own `.name`.
#   - `direction:` (optional, `max` | `min`, default `max`) — keras-tuner
#     ranking direction. Use `min` for counters / losses / distances.
#   - `objective:` (optional, default `false`) — promote to the per-dataset
#     tuner's oracle objective. Each tagged entry becomes one axis of a
#     multi-objective ranking; the primary `reward:` is always an objective.
#   - All other keys flow to the metric (or wrapped-reward) constructor —
#     notably `name:` sets the metric's internal `.name` (= result-dict key);
#     `language_model:` / `embedding_model:` are auto-resolved for rewards.
#
# Per-dataset `metrics:` lists (see "Datasets" section) extend this set;
# same alias → per-dataset wins.
metrics:

# --- Language-model usage (inference / generator phase) -----------------
  # These tick on every LM call the trial program makes — the Generator
  # in `build_program`, or the FunctionCallingAgent + its tool loop.

  - class: input_tokens                # prompt tokens consumed by this run
    direction: min
  - class: output_tokens               # completion tokens generated
    direction: min
  - class: total_tokens                # input + output, the headline counter
    direction: min
  - class: avg_input_tokens_per_call   # mean prompt length per LM call
    direction: min
  - class: avg_output_tokens_per_call  # mean completion length per LM call
    direction: min
  - class: tokens_per_second           # throughput, tokens/sec
    direction: max
  - class: throughput                  # throughput, LM calls/sec (RPS)
    direction: max
  - class: cost                        # USD as reported by litellm
    direction: min
  - class: avg_cost_per_call           # mean $/call — useful with bursty traffic
    direction: min
  - class: cached_tokens               # prompt tokens served from provider cache
    direction: max                     # more cache hits → cheaper run
  - class: cache_creation_tokens       # tokens written to cache (Anthropic) — billed higher
    direction: min
  - class: cache_hit_rate              # cached / prompt_tokens; 0.7+ is good
    direction: max
  - class: reasoning_tokens            # extended-thinking output (Claude / o-series)
    direction: min                     # informational; not always loss-style
  - class: reasoning_token_share       # reasoning / completion ratio
    direction: max                     # higher = model actually using its thinking budget

  # --- Reward-phase LM usage ----------------------------------------------
  # Tick only on LM calls made *inside* reward computation — e.g. the
  # judge in `lm_as_judge`, the sub-LM in `recursive_lm_as_judge`, the
  # panel members in `multi_judge_panel`, the verifier in `lm_as_verifier`.
  # Empty when the primary reward is non-LM (exact_match, regex, etc.).

  # - class: reward_input_tokens         # judge / verifier prompt tokens
  #   direction: min
  # - class: reward_output_tokens        # judge / verifier completion tokens
  #   direction: min
  # - class: reward_total_tokens         # input + output, reward phase
  #   direction: min
  # - class: avg_reward_input_tokens_per_call
  #   direction: min
  # - class: avg_reward_output_tokens_per_call
  #   direction: min
  # - class: reward_tokens_per_second
  #   direction: max
  # - class: reward_throughput           # judge calls / sec
  #   direction: max
  # - class: reward_cost                 # USD spent on judge / verifier LMs
  #   direction: min
  # - class: avg_reward_cost_per_call
  #   direction: min
  # - class: reward_cached_tokens
  #   direction: max
  # - class: reward_cache_creation_tokens
  #   direction: min
  # - class: reward_cache_hit_rate
  #   direction: max
  # - class: reward_reasoning_tokens
  #   direction: min
  # - class: reward_reasoning_token_share
  #   direction: max

  # --- Embedding-model usage (inference phase) ----------------------------
  # Tick when a Generator / agent uses an embedding model — uncommon in
  # the arena's default Generator path; common for retrieval / RAG setups.

  # - class: embedding_tokens
  #   direction: min
  # - class: embedding_vectors           # number of vectors produced (~ batch size × calls)
  #   direction: min
  # - class: embedding_cost
  #   direction: min
  # - class: embedding_throughput        # embedding calls / sec
  #   direction: max
  # - class: embedding_tokens_per_second
  #   direction: max
  # - class: embedding_vectors_per_second
  #   direction: max
  # - class: avg_embedding_tokens_per_call
  #   direction: min
  # - class: avg_embedding_vectors_per_call  # average batch size
  #   direction: max                     # bigger batches → better amortization
  # - class: avg_embedding_cost_per_call
  #   direction: min
  # - class: embedding_cached_tokens
  #   direction: max
  # - class: embedding_cache_hit_rate
  #   direction: max

  # --- Reward-phase embedding usage ---------------------------------------
  # Tick only on embedding calls inside the reward — e.g. `cosine_similarity`
  # against an `embedding_model`. Empty otherwise.

  # - class: reward_embedding_tokens
  #   direction: min
  # - class: reward_embedding_vectors
  #   direction: min
  # - class: reward_embedding_cost
  #   direction: min
  # - class: reward_embedding_throughput
  #   direction: max
  # - class: reward_embedding_tokens_per_second
  #   direction: max
  # - class: reward_embedding_vectors_per_second
  #   direction: max
  # - class: avg_reward_embedding_tokens_per_call
  #   direction: min
  # - class: avg_reward_embedding_vectors_per_call
  #   direction: max
  # - class: avg_reward_embedding_cost_per_call
  #   direction: min
  # - class: reward_embedding_cached_tokens
  #   direction: max
  # - class: reward_embedding_cache_hit_rate
  #   direction: max

  # --- Program-wide -------------------------------------------------------
  # Aggregate counters at the top-level `program(...)` invocation layer —
  # cover every LM and embedding call the program makes, in any phase.

  # - class: program_calls               # number of program invocations
  #   direction: max
  # - class: program_elapsed_time        # wall-clock seconds inside program()
  #   direction: min
  # - class: program_calls_per_second
  #   direction: max
  # - class: program_cost                # total $ across every LM + embedder
  #   direction: min
  # - class: program_avg_cost_per_invocation
  #   direction: min

  # --- Custom-named instance ----------------------------------------------
  # `name:` flows into the constructor and becomes the metric's `.name`
  # (the key synalinks writes into its evaluate() result dict). `alias:`
  # is the column header in the result matrix / TSV (defaults to `name`).
  # - class: total_tokens
  #   name: prompt_plus_completion
  #   alias: total_tok
  #   direction: min

  # --- Reduction wrappers / classification metrics ------------------------
  # `mean` / `sum` / `mean_metric_wrapper` need a callable to wrap, so they
  # don't make sense as plain string identifiers here. `accuracy` /
  # `binary_accuracy` / `categorical_accuracy` / `precision` / `recall` and
  # their binary/categorical variants apply per-dataset (label semantics
  # depend on the output schema), so prefer attaching them under a
  # dataset's `metrics:` block rather than globally.

# --- Experiments ----------------------------------------------------------
# One `synalinks.tuners.GridSearch` runs per dataset over the cross product
# of `language_models:`. `datasets:` is optional; when omitted, the single
# dataset named by the top-level `default:` key is used. The dataset is a
# fixed search *context* per tuner, not an axis — model is the only HP,
# ranked by each dataset's own multi-objective (primary `reward:` plus any
# top-level or per-dataset metric tagged `objective: true`).
experiments:
  language_models:
    - ollama/mistral
    - ollama/llama3.2
    - ollama/qwen3:0.6b
  datasets:
    - mmlu_test
    - gsm8k_train
